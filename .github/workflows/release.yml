name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  package-windows:
    name: Build and test Windows release asset
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned .NET 8 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.424

      - name: Publish and smoke-test exact Windows asset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_NAME -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:[.-][0-9A-Za-z.-]+)?$') {
              throw "Tag must be a SemVer-like value such as v2.10.0: $env:GITHUB_REF_NAME"
          }

          $version = $env:GITHUB_REF_NAME.Substring(1)
          $project = '.\gui\CdromDumpToolsGui\CdromDumpToolsGui.csproj'
          $publishDirectory = Join-Path $env:RUNNER_TEMP 'gui-publish'
          $distDirectory = Join-Path $PWD 'dist'
          $assetName = "cdrom-dump-tools-$version-windows-x64.exe"
          $licenseAssetName = "cdrom-dump-tools-$version-dotnet-LICENSE.txt"
          $noticesAssetName = "cdrom-dump-tools-$version-dotnet-THIRD-PARTY-NOTICES.txt"

          $projectVersionNode = Select-Xml -Path $project -XPath '/Project/PropertyGroup/Version'
          if ($null -eq $projectVersionNode -or [string]$projectVersionNode.Node.InnerText -cne $version) {
              throw "Release tag version '$version' differs from the GUI project version '$($projectVersionNode.Node.InnerText)'."
          }
          $converterSource = Get-Content -LiteralPath '.\bin_to_audio_windows.ps1' -Raw
          $converterVersions = @(
              [regex]::Matches($converterSource, 'BinToAudioWindows/(?<version>[0-9]+\.[0-9]+\.[0-9]+)') |
                  ForEach-Object { $_.Groups['version'].Value } |
                  Sort-Object -Unique
          )
          if ($converterVersions.Count -ne 1 -or $converterVersions[0] -cne $version) {
              throw "Release tag version '$version' differs from embedded converter component version(s): $($converterVersions -join ', ')."
          }

          dotnet restore $project --runtime win-x64
          dotnet publish $project `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output $publishDirectory `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:ContinuousIntegrationBuild=true `
            -p:Version=$version `
            -p:DebugSymbols=false `
            -p:DebugType=None

          $publishedFiles = @(Get-ChildItem -LiteralPath $publishDirectory -File)
          if ($publishedFiles.Count -ne 1 -or $publishedFiles[0].Name -cne 'CdromDumpToolsGui.exe') {
              $publishedFiles | Format-Table Name, Length -AutoSize
              throw 'GUI publish output must contain exactly one CdromDumpToolsGui.exe file.'
          }
          if ($publishedFiles[0].Length -lt 1MB) {
              throw 'Published GUI is unexpectedly small for a self-contained executable.'
          }

          $selfTest = Start-Process `
            -FilePath $publishedFiles[0].FullName `
            -ArgumentList '--self-test-embedded-script' `
            -Wait `
            -PassThru
          if ($selfTest.ExitCode -ne 0) {
              throw "Published GUI embedded-script self-test failed with exit code $($selfTest.ExitCode)."
          }
          $viewportSelfTest = Start-Process `
            -FilePath $publishedFiles[0].FullName `
            -ArgumentList '--self-test-log-viewport' `
            -Wait `
            -PassThru
          if ($viewportSelfTest.ExitCode -ne 0) {
              throw "Published GUI log-viewport self-test failed with exit code $($viewportSelfTest.ExitCode)."
          }

          $productVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo($publishedFiles[0].FullName).ProductVersion
          if ([string]::IsNullOrWhiteSpace($productVersion) -or !$productVersion.StartsWith($version, [StringComparison]::Ordinal)) {
              throw "Published GUI product version '$productVersion' does not begin with tag version '$version'."
          }

          $null = New-Item -ItemType Directory -Path $distDirectory -Force
          Copy-Item `
            -LiteralPath $publishedFiles[0].FullName `
            -Destination (Join-Path $distDirectory $assetName)

          $dotnetExecutable = (Get-Command dotnet -ErrorAction Stop).Source
          $candidateDotnetRoots = @()
          if (![string]::IsNullOrWhiteSpace($env:DOTNET_ROOT)) {
              $candidateDotnetRoots += [IO.Path]::GetFullPath($env:DOTNET_ROOT)
          }
          $candidateDotnetRoots += [IO.Path]::GetFullPath((Split-Path -Parent $dotnetExecutable))
          $candidateDotnetRoots = @($candidateDotnetRoots | Select-Object -Unique)

          $dotnetRoot = $candidateDotnetRoots | Where-Object {
              (Test-Path -LiteralPath (Join-Path $_ 'LICENSE.txt') -PathType Leaf) -and
              (Test-Path -LiteralPath (Join-Path $_ 'ThirdPartyNotices.txt') -PathType Leaf)
          } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($dotnetRoot)) {
              throw "Could not find LICENSE.txt and ThirdPartyNotices.txt in the checked .NET roots: $($candidateDotnetRoots -join ', ')"
          }

          $dotnetLicense = Join-Path $dotnetRoot 'LICENSE.txt'
          $dotnetNotices = Join-Path $dotnetRoot 'ThirdPartyNotices.txt'
          Copy-Item -LiteralPath $dotnetLicense -Destination (Join-Path $distDirectory $licenseAssetName)
          Copy-Item -LiteralPath $dotnetNotices -Destination (Join-Path $distDirectory $noticesAssetName)

          $expectedAssets = @($assetName, $licenseAssetName, $noticesAssetName)
          $actualAssets = @(Get-ChildItem -LiteralPath $distDirectory -File | Select-Object -ExpandProperty Name)
          $assetDifferences = @(Compare-Object -ReferenceObject $expectedAssets -DifferenceObject $actualAssets)
          if ($actualAssets.Count -ne $expectedAssets.Count -or $assetDifferences.Count -ne 0) {
              throw "Windows artifact staging differs from the expected files: $($actualAssets -join ', ')"
          }

      - name: Upload tested Windows release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            dist/*.exe
            dist/*-dotnet-LICENSE.txt
            dist/*-dotnet-THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  package-macos:
    name: Build and test unsigned macOS ${{ matrix.asset_arch }} DMG (Xcode 26)
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target_arch: arm64
            asset_arch: arm64
          - runner: macos-26-intel
            target_arch: x86_64
            asset_arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      TARGET_ARCH: ${{ matrix.target_arch }}
      ASSET_ARCH: ${{ matrix.asset_arch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and verify exact unsigned macOS asset
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          OUTPUT_DIR: ${{ runner.temp }}/macos-dist
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$TARGET_ARCH"
          test "$(xcodebuild -version | awk 'NR == 1 { print $2 }')" = 26.6
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" -ge 26
          export VERSION="${GITHUB_REF_NAME#v}"
          bash macos/build_macos_app.sh

          expected_asset="$OUTPUT_DIR/cdrom-dump-tools-${VERSION}-macos-${ASSET_ARCH}-unsigned.dmg"
          if [[ ! -s "$expected_asset" ]]; then
            printf 'Expected unsigned macOS DMG is missing or empty: %s\n' "$expected_asset" >&2
            exit 1
          fi
          hdiutil verify "$expected_asset"

      - name: Stage unsigned macOS release asset
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/macos-dist
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          asset="cdrom-dump-tools-${version}-macos-${ASSET_ARCH}-unsigned.dmg"
          mkdir -p dist
          install -m 0644 "$OUTPUT_DIR/$asset" "dist/$asset"

      - name: Upload tested unsigned macOS release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.asset_arch }}-unsigned-release
          path: dist/*-macos-${{ matrix.asset_arch }}-unsigned.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  package-ios:
    name: Build and test unsigned iOS 26 arm64 IPA (Xcode 26)
    needs: validate
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and verify exact unsigned iOS 26 asset
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          OUTPUT_DIR: ${{ runner.temp }}/ios-dist
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(xcodebuild -version | awk 'NR == 1 { print $2 }')" = 26.6
          test "$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)" = 26
          test "$(xcrun --sdk iphonesimulator --show-sdk-version | cut -d. -f1)" = 26
          export VERSION="${GITHUB_REF_NAME#v}"
          bash ios/build_ios_ipa.sh

          expected_asset="$OUTPUT_DIR/cdrom-dump-tools-${VERSION}-ios26-arm64-unsigned.ipa"
          if [[ ! -s "$expected_asset" ]]; then
            printf 'Expected unsigned iOS IPA is missing or empty: %s\n' "$expected_asset" >&2
            exit 1
          fi
          unzip -t "$expected_asset"

      - name: Stage unsigned iOS 26 release asset
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/ios-dist
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          asset="cdrom-dump-tools-${version}-ios26-arm64-unsigned.ipa"
          mkdir -p dist
          install -m 0644 "$OUTPUT_DIR/$asset" "dist/$asset"

      - name: Upload tested unsigned iOS 26 release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios26-arm64-unsigned-release
          path: dist/*-ios26-arm64-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  package-linux-deb:
    name: Build and test Ubuntu/Debian ${{ matrix.arch }} package
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GNOME package validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.machine }}"
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            dbus-x11 \
            desktop-file-utils \
            ffmpeg \
            gir1.2-adw-1 \
            gir1.2-gtk-4.0 \
            libsecret-tools \
            lintian \
            python3-gi \
            xauth \
            xvfb

      - name: Build and verify exact native Debian package
        shell: bash
        env:
          DOWNLOAD_CACHE_DIR: ${{ runner.temp }}/powershell-downloads
          OUTPUT_DIR: ${{ runner.temp }}/linux-deb
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          export VERSION="${GITHUB_REF_NAME#v}"
          bash linux/build_deb.sh

          expected_asset="$OUTPUT_DIR/cdrom-dump-tools-${VERSION}-ubuntu-debian-${TARGET_ARCH}.deb"
          if [[ ! -s "$expected_asset" ]]; then
            printf 'Expected Debian package is missing or empty: %s\n' "$expected_asset" >&2
            exit 1
          fi
          CI=true bash linux/test_installed_package.sh "$expected_asset"

          mkdir -p dist
          install -m 0644 "$expected_asset" "dist/$(basename -- "$expected_asset")"

      - name: Upload tested Debian release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}-deb-release
          path: dist/*-ubuntu-debian-${{ matrix.arch }}.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Package and publish
    needs:
      - validate
      - package-windows
      - package-macos
      - package-ios
      - package-linux-deb
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            printf 'Tag must be a SemVer-like value such as v2.10.0: %s\n' "$tag" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            printf 'Release tag %s does not point to a commit reachable from origin/main.\n' "$tag" >&2
            exit 1
          fi

      - name: Download tested Windows release asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release
          path: dist

      - name: Download tested unsigned macOS arm64 release asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-arm64-unsigned-release
          path: dist

      - name: Download tested unsigned macOS x64 release asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-x64-unsigned-release
          path: dist

      - name: Download tested unsigned iOS 26 arm64 release asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios26-arm64-unsigned-release
          path: dist

      - name: Download tested Ubuntu/Debian amd64 release asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-amd64-deb-release
          path: dist

      - name: Download tested Ubuntu/Debian arm64 release asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-arm64-deb-release
          path: dist

      - name: Ensure release tooling
        shell: bash
        run: |
          set -euo pipefail
          command -v gh >/dev/null

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="cdrom-dump-tools-${version}"
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          windows_executable="dist/${package}-windows-x64.exe"
          macos_arm64_dmg="dist/${package}-macos-arm64-unsigned.dmg"
          macos_x64_dmg="dist/${package}-macos-x64-unsigned.dmg"
          ios26_arm64_ipa="dist/${package}-ios26-arm64-unsigned.ipa"
          linux_amd64_deb="dist/${package}-ubuntu-debian-amd64.deb"
          linux_arm64_deb="dist/${package}-ubuntu-debian-arm64.deb"
          dotnet_license="dist/${package}-dotnet-LICENSE.txt"
          dotnet_notices="dist/${package}-dotnet-THIRD-PARTY-NOTICES.txt"
          env_template="dist/${package}.env.example"

          for required_asset in \
            "$windows_executable" \
            "$macos_arm64_dmg" \
            "$macos_x64_dmg" \
            "$ios26_arm64_ipa" \
            "$linux_amd64_deb" \
            "$linux_arm64_deb" \
            "$dotnet_license" \
            "$dotnet_notices"; do
            if [[ ! -s "$required_asset" ]]; then
              printf 'Required tested release asset is missing or empty: %s\n' "$required_asset" >&2
              exit 1
            fi
          done
          install -m 0644 .env.example "$env_template"
          mkdir -p "dist/linux/$package"
          install -m 0644 README.md "dist/linux/$package/"

          if find dist -type f -name '.env' -print -quit | grep -q .; then
            printf 'A real .env file must never enter release artifacts.\n' >&2
            exit 1
          fi

          install -m 0755 dump_cdrom.sh bin_to_audio.sh "dist/linux/$package/"
          find "dist/linux/$package" -exec touch -d "@$source_date_epoch" {} +

          tar \
            --sort=name \
            --mtime="@${source_date_epoch}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C dist/linux \
            -cf - "$package" |
            gzip -n >"dist/${package}-linux.tar.gz"

          (
            cd dist
            sha256sum \
              "${package}-windows-x64.exe" \
              "${package}-macos-arm64-unsigned.dmg" \
              "${package}-macos-x64-unsigned.dmg" \
              "${package}-ios26-arm64-unsigned.ipa" \
              "${package}-ubuntu-debian-amd64.deb" \
              "${package}-ubuntu-debian-arm64.deb" \
              "${package}-dotnet-LICENSE.txt" \
              "${package}-dotnet-THIRD-PARTY-NOTICES.txt" \
              "${package}.env.example" \
              "${package}-linux.tar.gz" >SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          windows_executable="dist/cdrom-dump-tools-${version}-windows-x64.exe"
          macos_arm64_dmg="dist/cdrom-dump-tools-${version}-macos-arm64-unsigned.dmg"
          macos_x64_dmg="dist/cdrom-dump-tools-${version}-macos-x64-unsigned.dmg"
          ios26_arm64_ipa="dist/cdrom-dump-tools-${version}-ios26-arm64-unsigned.ipa"
          linux_amd64_deb="dist/cdrom-dump-tools-${version}-ubuntu-debian-amd64.deb"
          linux_arm64_deb="dist/cdrom-dump-tools-${version}-ubuntu-debian-arm64.deb"
          dotnet_license="dist/cdrom-dump-tools-${version}-dotnet-LICENSE.txt"
          dotnet_notices="dist/cdrom-dump-tools-${version}-dotnet-THIRD-PARTY-NOTICES.txt"
          env_template="dist/cdrom-dump-tools-${version}.env.example"
          linux_archive="dist/cdrom-dump-tools-${version}-linux.tar.gz"
          checksums="dist/SHA256SUMS.txt"
          linux_note=$'## Linux GNOME packages\nUbuntu/Debian GNOME packages are published for both amd64 and arm64. Download the package matching your CPU architecture and install it with `sudo apt install ./PACKAGE.deb`.'
          macos_warning=$'> [!WARNING]\n> The macOS arm64 and x64 DMGs are ad-hoc signed and have not been signed with an Apple Developer ID or notarized by Apple. Gatekeeper may block them; both assets are intentionally named `unsigned`.'
          ios_warning=$'> [!WARNING]\n> The iOS 26 arm64 IPA is intentionally unsigned and contains no provisioning profile. It cannot be installed directly on a normal iPhone or iPad; sign it with your own Apple Developer identity and matching provisioning profile before installation.'
          release_notes="${linux_note}"$'\n\n'"${macos_warning}"$'\n\n'"${ios_warning}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "$windows_executable" \
              "$macos_arm64_dmg" \
              "$macos_x64_dmg" \
              "$ios26_arm64_ipa" \
              "$linux_amd64_deb" \
              "$linux_arm64_deb" \
              "$dotnet_license" \
              "$dotnet_notices" \
              "$env_template" \
              "$linux_archive" \
              "$checksums" \
              --clobber
          else
            gh release create "$tag" \
              "$windows_executable" \
              "$macos_arm64_dmg" \
              "$macos_x64_dmg" \
              "$ios26_arm64_ipa" \
              "$linux_amd64_deb" \
              "$linux_arm64_deb" \
              "$dotnet_license" \
              "$dotnet_notices" \
              "$env_template" \
              "$linux_archive" \
              "$checksums" \
              --verify-tag \
              --notes "$release_notes" \
              --generate-notes \
              --title "$tag"
          fi

          current_notes="$(gh release view "$tag" --json body --jq '.body // ""')"
          missing_sections=''
          if [[ "$current_notes" != *'## Linux GNOME packages'* ]]; then
            missing_sections="$linux_note"
          fi
          if [[ "$current_notes" != *'macOS arm64 and x64 DMGs are ad-hoc signed'* ]]; then
            if [[ -n "$missing_sections" ]]; then
              missing_sections+=$'\n\n'
            fi
            missing_sections+="$macos_warning"
          fi
          if [[ "$current_notes" != *'iOS 26 arm64 IPA is intentionally unsigned'* ]]; then
            if [[ -n "$missing_sections" ]]; then
              missing_sections+=$'\n\n'
            fi
            missing_sections+="$ios_warning"
          fi
          if [[ -n "$missing_sections" ]]; then
            notes_file="$RUNNER_TEMP/release-notes-with-required-sections.md"
            printf '%s\n\n%s\n' "$missing_sections" "$current_notes" >"$notes_file"
            gh release edit "$tag" --notes-file "$notes_file"
          fi

          release_assets_json="$RUNNER_TEMP/release-assets.json"
          gh release view "$tag" --json assets >"$release_assets_json"
          for local_asset in \
            "$windows_executable" \
            "$macos_arm64_dmg" \
            "$macos_x64_dmg" \
            "$ios26_arm64_ipa" \
            "$linux_amd64_deb" \
            "$linux_arm64_deb" \
            "$dotnet_license" \
            "$dotnet_notices" \
            "$env_template" \
            "$linux_archive" \
            "$checksums"; do
            asset_name="$(basename "$local_asset")"
            local_size="$(stat -c '%s' "$local_asset")"
            remote_size="$(
              jq -r \
                --arg name "$asset_name" \
                '[.assets[] | select(.name == $name)] | if length == 1 then .[0].size else empty end' \
                "$release_assets_json"
            )"
            if [[ -z "$remote_size" || "$remote_size" != "$local_size" ]]; then
              printf 'Published release asset %s has size %s; expected %s.\n' \
                "$asset_name" "${remote_size:-missing}" "$local_size" >&2
              exit 1
            fi
          done
