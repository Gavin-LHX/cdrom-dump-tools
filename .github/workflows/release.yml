name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Package and publish
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            printf 'Tag must be a SemVer-like value such as v2.6.0: %s\n' "$tag" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            printf 'Release tag %s does not point to a commit reachable from origin/main.\n' "$tag" >&2
            exit 1
          fi

      - name: Ensure packaging tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zip
          fi
          command -v gh >/dev/null

      - name: Build reproducible release archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="cdrom-dump-tools-${version}"
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"

          mkdir -p "dist/windows/$package" "dist/linux/$package"
          install -m 0644 README.md bin_to_audio_windows.ps1 bin_to_audio_windows.cmd "dist/windows/$package/"
          install -m 0644 README.md "dist/linux/$package/"
          install -m 0755 dump_cdrom.sh bin_to_audio.sh "dist/linux/$package/"
          find "dist/windows/$package" "dist/linux/$package" -exec touch -d "@$source_date_epoch" {} +

          (
            cd dist/windows
            zip -X -9 -r "../${package}-windows.zip" "$package"
          )
          tar \
            --sort=name \
            --mtime="@${source_date_epoch}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C dist/linux \
            -cf - "$package" |
            gzip -n >"dist/${package}-linux.tar.gz"

          (
            cd dist
            sha256sum "${package}-windows.zip" "${package}-linux.tar.gz" >SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          windows_archive="dist/cdrom-dump-tools-${version}-windows.zip"
          linux_archive="dist/cdrom-dump-tools-${version}-linux.tar.gz"
          checksums="dist/SHA256SUMS.txt"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$windows_archive" "$linux_archive" "$checksums" --clobber
          else
            gh release create "$tag" \
              "$windows_archive" \
              "$linux_archive" \
              "$checksums" \
              --verify-tag \
              --generate-notes \
              --title "$tag"
          fi
