name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - gui
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Bash and ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify environment-file safety
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -Ev '(^|/)\.env\.example$'; then
            echo 'A real environment file is tracked by Git.' >&2
            exit 1
          fi
          if grep -Eq '^(GOOGLE_TRANSLATE_API_KEY|OPENAI_API_KEY|ANTHROPIC_API_KEY)=.+' .env.example; then
            echo '.env.example must not contain API keys.' >&2
            exit 1
          fi

      - name: Install pinned ShellCheck
        shell: bash
        run: |
          set -Eeuo pipefail
          tool_root="$RUNNER_TEMP/shellcheck-0.11.0"
          archive="$tool_root/shellcheck.tar.xz"
          mkdir -p "$tool_root"
          curl --proto '=https' --tlsv1.2 -fsSLo "$archive" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          printf '%s  %s\n' \
            '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198' \
            "$archive" |
            sha256sum --check -
          tar -xJf "$archive" -C "$tool_root"
          printf '%s\n' "$tool_root/shellcheck-v0.11.0" >>"$GITHUB_PATH"

      - name: Ensure converter dry-run dependencies
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for command_name in sox soxi flac metaflac; do
            if ! command -v "$command_name" >/dev/null 2>&1; then
              missing=1
              break
            fi
          done
          if ((missing)); then
            sudo apt-get update
            sudo apt-get install -y shellcheck sox flac
          fi

      - name: Validate Bash syntax and style
        shell: bash
        run: |
          set -euo pipefail
          bash -n dump_cdrom.sh bin_to_audio.sh linux/build_deb.sh linux/test_installed_package.sh macos/build_macos_app.sh ios/build_ios_ipa.sh tests/dump_cdrom_release_selection.Tests.sh
          shellcheck --external-sources --severity=warning \
            dump_cdrom.sh \
            bin_to_audio.sh \
            linux/build_deb.sh \
            linux/test_installed_package.sh \
            linux/packaging/cdrom-dump-tools \
            macos/build_macos_app.sh \
            ios/build_ios_ipa.sh \
            tests/dump_cdrom_release_selection.Tests.sh
          bash dump_cdrom.sh --help >/dev/null

      - name: Test MusicBrainz release selection for Linux dumps
        shell: bash
        run: |
          set -euo pipefail
          bash tests/dump_cdrom_release_selection.Tests.sh

      - name: Run Linux converter offline smoke test
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          trap 'rm -rf -- "$fixture"' EXIT
          truncate -s 352800 "$fixture/test-disc.bin"
          cat >"$fixture/test-disc.toc" <<'TOC'
          CD_DA

          TRACK AUDIO
          NO COPY
          NO PRE_EMPHASIS
          TWO_CHANNEL_AUDIO
          FILE "test-disc.bin" 0 00:02:00
          TOC
          bash bin_to_audio.sh \
            --dry-run \
            --toc "$fixture/test-disc.toc" \
            --output-dir "$fixture/output" \
            "$fixture/test-disc.bin"

  powershell:
    name: Windows PowerShell compatibility
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned .NET 8 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.424

      - name: Restore and build GUI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $guiProject = '.\gui\CdromDumpToolsGui\CdromDumpToolsGui.csproj'
          $checksProject = '.\gui\CdromDumpToolsGui.CoreChecks\CdromDumpToolsGui.CoreChecks.csproj'

          dotnet restore $guiProject
          dotnet restore $checksProject
          dotnet build $guiProject --configuration Release --no-restore -p:ContinuousIntegrationBuild=true
          dotnet build $checksProject --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Run GUI core and embedded-script checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checksProject = '.\gui\CdromDumpToolsGui.CoreChecks\CdromDumpToolsGui.CoreChecks.csproj'
          dotnet run --project $checksProject --configuration Release --no-build

      - name: Verify self-contained single-file GUI publish
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $guiProject = '.\gui\CdromDumpToolsGui\CdromDumpToolsGui.csproj'
          $publishDirectory = Join-Path $env:RUNNER_TEMP "cdrom-dump-tools-gui-$([guid]::NewGuid().ToString('N'))"

          dotnet publish $guiProject `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output $publishDirectory `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:ContinuousIntegrationBuild=true `
            -p:DebugSymbols=false `
            -p:DebugType=None

          $publishedFiles = @(Get-ChildItem -LiteralPath $publishDirectory -File)
          if ($publishedFiles.Count -ne 1 -or $publishedFiles[0].Name -cne 'CdromDumpToolsGui.exe') {
              $publishedFiles | Format-Table Name, Length -AutoSize
              throw 'GUI publish output must contain exactly one CdromDumpToolsGui.exe file.'
          }
          if ($publishedFiles[0].Length -lt 1MB) {
              throw 'Published GUI is unexpectedly small for a self-contained executable.'
          }

          $selfTest = Start-Process `
            -FilePath $publishedFiles[0].FullName `
            -ArgumentList '--self-test-embedded-script' `
            -Wait `
            -PassThru
          if ($selfTest.ExitCode -ne 0) {
              throw "Published GUI embedded-script self-test failed with exit code $($selfTest.ExitCode)."
          }
          $viewportSelfTest = Start-Process `
            -FilePath $publishedFiles[0].FullName `
            -ArgumentList '--self-test-log-viewport' `
            -Wait `
            -PassThru
          if ($viewportSelfTest.ExitCode -ne 0) {
              throw "Published GUI log-viewport self-test failed with exit code $($viewportSelfTest.ExitCode)."
          }

      - name: Parse with PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = (Resolve-Path -LiteralPath '.\bin_to_audio_windows.ps1').Path
          $bytes = [IO.File]::ReadAllBytes($path)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              throw 'bin_to_audio_windows.ps1 must remain UTF-8 with BOM for Windows PowerShell 5.1.'
          }
          $tokens = $null
          $errors = $null
          [void] [System.Management.Automation.Language.Parser]::ParseFile($path, [ref] $tokens, [ref] $errors)
          if ($errors.Count -gt 0) {
              $messages = $errors | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }
              throw ($messages -join [Environment]::NewLine)
          }

      - name: Run PowerShell 7 offline tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\tests\lyrics_translation_fallback.Tests.ps1'
          & '.\tests\audio_verification.Tests.ps1'
          & '.\tests\release_selection_protocol.Tests.ps1'

      - name: Parse and smoke test with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = (Resolve-Path -LiteralPath '.\bin_to_audio_windows.ps1').Path
          $tokens = $null
          $errors = $null
          [void] [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref] $tokens, [ref] $errors)
          if ($errors.Count -gt 0) {
              $messages = $errors | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }
              throw ($messages -join [Environment]::NewLine)
          }

          $fixture = Join-Path $env:RUNNER_TEMP 'cdrom-dump-tools-smoke'
          $output = Join-Path $fixture 'output'
          $null = New-Item -ItemType Directory -Path $fixture -Force
          [IO.File]::WriteAllBytes((Join-Path $fixture 'test-disc.bin'), [byte[]]::new(352800))
          $toc = @'
          CD_DA

          TRACK AUDIO
          NO COPY
          NO PRE_EMPHASIS
          TWO_CHANNEL_AUDIO
          FILE "test-disc.bin" 0 00:02:00
          '@
          [IO.File]::WriteAllText((Join-Path $fixture 'test-disc.toc'), $toc, [Text.Encoding]::ASCII)
          $fakeFfmpeg = @'
          @echo off
          setlocal EnableExtensions DisableDelayedExpansion
          set "output="
          set "hash_mode="
          :next
          if "%~1"=="" goto done
          if /I "%~1"=="hash" set "hash_mode=1"
          set "output=%~1"
          shift
          goto next
          :done
          if not defined output exit /b 1
          if defined OPENAI_API_KEY exit /b 97
          if defined hash_mode goto hash
          > "%output%" echo fake-audio
          exit /b 0
          :hash
          if not defined CDROM_FAKE_PCM_HASH exit /b 96
          echo SHA256=%CDROM_FAKE_PCM_HASH%
          exit /b 0
          '@
          $fakeFfmpegPath = Join-Path $fixture 'ffmpeg.cmd'
          [IO.File]::WriteAllText($fakeFfmpegPath, $fakeFfmpeg, [Text.Encoding]::ASCII)

          $previousOpenAiKey = [Environment]::GetEnvironmentVariable('OPENAI_API_KEY', [EnvironmentVariableTarget]::Process)
          $previousFakePcmHash = [Environment]::GetEnvironmentVariable('CDROM_FAKE_PCM_HASH', [EnvironmentVariableTarget]::Process)
          try {
            [Environment]::SetEnvironmentVariable('OPENAI_API_KEY', 'ci-secret-must-not-reach-ffmpeg', [EnvironmentVariableTarget]::Process)
            $expectedPcmHash = (Get-FileHash -LiteralPath (Join-Path $fixture 'test-disc.bin') -Algorithm SHA256).Hash.ToLowerInvariant()
            [Environment]::SetEnvironmentVariable('CDROM_FAKE_PCM_HASH', $expectedPcmHash, [EnvironmentVariableTarget]::Process)
            & $scriptPath `
              -BinPath (Join-Path $fixture 'test-disc.bin') `
              -TocPath (Join-Path $fixture 'test-disc.toc') `
              -OutputDirectory $output `
              -FfmpegPath $fakeFfmpegPath `
              -NoMetadata `
              -NoCover `
              -NoLyrics `
              -VerifyAudio `
              -NoPause
          }
          finally {
            [Environment]::SetEnvironmentVariable('OPENAI_API_KEY', $previousOpenAiKey, [EnvironmentVariableTarget]::Process)
            [Environment]::SetEnvironmentVariable('CDROM_FAKE_PCM_HASH', $previousFakePcmHash, [EnvironmentVariableTarget]::Process)
          }
          if (-not (Test-Path -LiteralPath (Join-Path $output 'track-01.flac'))) {
              throw 'Windows PowerShell smoke test did not create the expected output track.'
          }

          $verificationJsonPath = Join-Path $output 'audio-verification.json'
          $verificationTextPath = Join-Path $output 'audio-verification.txt'
          if (-not (Test-Path -LiteralPath $verificationJsonPath -PathType Leaf) -or
              -not (Test-Path -LiteralPath $verificationTextPath -PathType Leaf)) {
              throw 'Windows PowerShell smoke test did not create both audio verification reports.'
          }
          $verification = [IO.File]::ReadAllText($verificationJsonPath, [Text.Encoding]::UTF8) | ConvertFrom-Json
          if ($verification.schema -cne 'cdrom-audio-verification-v1' -or
              $verification.status -cne 'passed' -or
              [int] $verification.track_count -ne 1 -or
              @($verification.tracks).Count -ne 1) {
              throw 'Audio verification JSON summary has unexpected identity or counts.'
          }
          $verifiedTrack = @($verification.tracks)[0]
          if ($verifiedTrack.file -cne 'track-01.flac' -or
              [int64] $verifiedTrack.sample_count -ne 88200 -or
              $verifiedTrack.source_segment_sha256 -cne $expectedPcmHash -or
              $verifiedTrack.decoded_output_pcm_sha256 -cne $expectedPcmHash -or
              $verifiedTrack.match -ne $true) {
              throw 'Audio verification JSON track record does not prove the expected lossless match.'
          }
          $verificationText = [IO.File]::ReadAllText($verificationTextPath, [Text.Encoding]::UTF8)
          if ($verificationText -notmatch '(?m)^Audio verification: PASSED\r?$' -or
              $verificationText -notmatch '(?m)^Tracks verified: 1\r?$') {
              throw 'Human-readable audio verification report is incomplete.'
          }

          $checksumPath = Join-Path $output 'SHA256SUMS.txt'
          $checksumLines = @([IO.File]::ReadAllLines($checksumPath, [Text.Encoding]::UTF8))
          $manifest = @{}
          foreach ($line in $checksumLines) {
              if ($line -notmatch '^(?<hash>[0-9a-f]{64}) \*(?<name>.+)$') {
                  throw "Invalid SHA256SUMS line: $line"
              }
              $manifest[$Matches['name']] = $Matches['hash']
          }
          $expectedFiles = @(Get-ChildItem -LiteralPath $output -File -Recurse | Where-Object {
              $_.FullName -cne $checksumPath
          })
          if ($manifest.Count -ne $expectedFiles.Count) {
              throw "SHA256SUMS covers $($manifest.Count) of $($expectedFiles.Count) deliverable files."
          }
          foreach ($file in $expectedFiles) {
              $relativeName = $file.FullName.Substring($output.Length).TrimStart([char[]]@('\', '/')).Replace('\', '/')
              if (-not $manifest.ContainsKey($relativeName)) {
                  throw "SHA256SUMS omitted deliverable: $relativeName"
              }
              $actualHash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($manifest[$relativeName] -cne $actualHash) {
                  throw "SHA256SUMS hash mismatch for: $relativeName"
              }
          }

          $failureOutput = Join-Path $fixture 'verification-failure-output'
          $failureOutputName = Split-Path -Leaf $failureOutput
          $wrongPcmHash = '0' * 64
          if ($wrongPcmHash -ceq $expectedPcmHash) {
              throw 'The deliberately incorrect verification hash unexpectedly matches the source fixture.'
          }
          $previousFakePcmHash = [Environment]::GetEnvironmentVariable('CDROM_FAKE_PCM_HASH', [EnvironmentVariableTarget]::Process)
          try {
              [Environment]::SetEnvironmentVariable('CDROM_FAKE_PCM_HASH', $wrongPcmHash, [EnvironmentVariableTarget]::Process)
              $failureArguments = @(
                  '-NoLogo',
                  '-NoProfile',
                  '-NonInteractive',
                  '-ExecutionPolicy', 'Bypass',
                  '-File', $scriptPath,
                  '-BinPath', (Join-Path $fixture 'test-disc.bin'),
                  '-TocPath', (Join-Path $fixture 'test-disc.toc'),
                  '-OutputDirectory', $failureOutput,
                  '-FfmpegPath', $fakeFfmpegPath,
                  '-NoMetadata',
                  '-NoCover',
                  '-NoLyrics',
                  '-VerifyAudio',
                  '-NoPause'
              )
              $failureProcess = Start-Process `
                  -FilePath (Join-Path $PSHOME 'powershell.exe') `
                  -ArgumentList $failureArguments `
                  -NoNewWindow `
                  -Wait `
                  -PassThru
          }
          finally {
              [Environment]::SetEnvironmentVariable('CDROM_FAKE_PCM_HASH', $previousFakePcmHash, [EnvironmentVariableTarget]::Process)
          }
          if ($failureProcess.ExitCode -eq 0) {
              throw 'Deliberately incorrect decoded-audio hash did not fail conversion.'
          }
          if (Test-Path -LiteralPath $failureOutput) {
              throw 'Verification failure published a final output directory.'
          }
          $orphanedFailurePartials = @(Get-ChildItem -LiteralPath $fixture -Directory -Force | Where-Object {
              $_.Name.StartsWith(".$failureOutputName.partial.", [StringComparison]::OrdinalIgnoreCase)
          })
          if ($orphanedFailurePartials.Count -ne 0) {
              throw "Verification failure left $($orphanedFailurePartials.Count) partial output directorie(s)."
          }

          & '.\tests\lyrics_translation_fallback.Tests.ps1'
          & '.\tests\audio_verification.Tests.ps1'
          & '.\tests\release_selection_protocol.Tests.ps1'

      - name: Run critical PSScriptAnalyzer rules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Repository PSGallery -Scope CurrentUser -Force -AllowClobber
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force
          $rules = @(
              'PSAvoidAssignmentToAutomaticVariable',
              'PSAvoidUsingConvertToSecureStringWithPlainText',
              'PSAvoidUsingInvokeExpression',
              'PSAvoidUsingPlainTextForPassword',
              'PSAvoidUsingUsernameAndPasswordParams',
              'PSPossibleIncorrectComparisonWithNull',
              'PSPossibleIncorrectUsageOfAssignmentOperator',
              'PSPossibleIncorrectUsageOfRedirectionOperator',
              'PSReservedCmdletChar',
              'PSReservedParams',
              'PSUsePSCredentialType',
              'PSUseApprovedVerbs'
          )
          $issues = @(Invoke-ScriptAnalyzer -Path '.\bin_to_audio_windows.ps1' -IncludeRule $rules)
          if ($issues.Count -gt 0) {
              $issues | Format-Table Severity, RuleName, Line, Column, Message -AutoSize
              throw "PSScriptAnalyzer found $($issues.Count) blocking issue(s)."
          }

  linux-gnome:
    name: Ubuntu/Debian GNOME ${{ matrix.arch }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GNOME package validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.machine }}"
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            dbus-x11 \
            desktop-file-utils \
            ffmpeg \
            gir1.2-adw-1 \
            gir1.2-gtk-4.0 \
            libsecret-tools \
            lintian \
            python3-gi \
            xauth \
            xvfb

      - name: Run Linux frontend unit tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/linux/app"
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/python-cache"
          python3 -m unittest discover -s linux/tests -v
          python3 -m py_compile linux/app/cdrom_dump_tools/*.py

      - name: Build and test native ${{ matrix.arch }} Debian package
        shell: bash
        env:
          DOWNLOAD_CACHE_DIR: ${{ runner.temp }}/powershell-downloads
          OUTPUT_DIR: ${{ runner.temp }}/linux-deb
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bash linux/build_deb.sh

          shopt -s nullglob
          packages=("$OUTPUT_DIR"/cdrom-dump-tools-*-ubuntu-debian-"$TARGET_ARCH".deb)
          if ((${#packages[@]} != 1)); then
            printf 'Expected exactly one %s Debian package, found %s.\n' \
              "$TARGET_ARCH" "${#packages[@]}" >&2
            exit 1
          fi
          test -s "${packages[0]}"
          CI=true bash linux/test_installed_package.sh "${packages[0]}"

  macos:
    name: macOS 14+ ${{ matrix.asset_arch }} native app (Xcode 26)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target_arch: arm64
            asset_arch: arm64
          - runner: macos-26-intel
            target_arch: x86_64
            asset_arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      TARGET_ARCH: ${{ matrix.target_arch }}
      ASSET_ARCH: ${{ matrix.asset_arch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify pinned native macOS build environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$TARGET_ARCH"
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
          sw_vers
          xcodebuild -version
          xcrun swiftc --version
          test "$(xcodebuild -version | awk 'NR == 1 { print $2 }')" = 26.6
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" -ge 26
          bash -n macos/build_macos_app.sh

      - name: Build and verify unsigned macOS ${{ matrix.asset_arch }} DMG
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          OUTPUT_DIR: ${{ runner.temp }}/macos-dist
        run: |
          set -euo pipefail
          bash macos/build_macos_app.sh

          shopt -s nullglob
          dmgs=("$OUTPUT_DIR"/cdrom-dump-tools-*-macos-"$ASSET_ARCH"-unsigned.dmg)
          if ((${#dmgs[@]} != 1)); then
            printf 'Expected exactly one unsigned macOS %s DMG, found %s.\n' "$ASSET_ARCH" "${#dmgs[@]}" >&2
            exit 1
          fi
          test -s "${dmgs[0]}"
          hdiutil verify "${dmgs[0]}"

  ios:
    name: iOS 26 native app and unsigned arm64 IPA (Xcode 26)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify pinned native iOS build environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
          test "$(xcodebuild -version | awk 'NR == 1 { print $2 }')" = 26.6
          test "$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)" = 26
          test "$(xcrun --sdk iphonesimulator --show-sdk-version | cut -d. -f1)" = 26
          xcodebuild -version
          xcrun swiftc --version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          bash -n ios/build_ios_ipa.sh

      - name: Run core self-test and build exact unsigned iOS 26 IPA
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          OUTPUT_DIR: ${{ runner.temp }}/ios-dist
        run: |
          set -euo pipefail
          version="$(sed -nE 's@.*<Version>([^<]+)</Version>.*@\1@p' gui/CdromDumpToolsGui/CdromDumpToolsGui.csproj | head -n 1)"
          test -n "$version"
          export VERSION="$version"
          bash ios/build_ios_ipa.sh

          expected_asset="$OUTPUT_DIR/cdrom-dump-tools-${version}-ios26-arm64-unsigned.ipa"
          test -s "$expected_asset"
          unzip -t "$expected_asset"
